services:
  - type: web
    name: student-accommodation-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://cs-student-accommodation-finder.vercel.app
      - key: GOOGLE_MAPS_API_KEY
        sync: false
